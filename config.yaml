# Tunable settings. Secrets (ANTHROPIC_KEY, BRAVE_API, APP_PASSWORD) come from the environment or keys.md.

paths:
  db: data/events.db
  heartbeat: /tmp/app-heartbeat

search:
  model: claude-sonnet-5-5
  max_tokens: 4096
  max_brave_calls: 4
  brave_results: 10
  brave_timeout_seconds: 10
  input_cost_per_mtok: 2.0
  output_cost_per_mtok: 10.0
  default_location: New York City
  default_days_ahead: 7
  default_queries:
    - {text: concerts, max_results: 5}
    - {text: classical music concerts, max_results: 5}
    - {text: art gallery shows, max_results: 5}
    - {text: museum exhibits, max_results: 5}
    - {text: block parties and street fairs, max_results: 5}
    - {text: comedy shows, max_results: 5}
    - {text: theater and broadway shows, max_results: 5}
    - {text: food festivals, max_results: 5}
    - {text: nightlife and club events, max_results: 5}
    - {text: sports games, max_results: 5}

model:
  embedding: all-MiniLM-L6-v2
  min_events_to_train: 4
  kernel_constant: 1.0
  kernel_length_scale: 1.0
  optimizer_restarts: 0
  calibration_folds: 5
  random_state: 42

context:
  model: claude-haiku-5-5
  effort: low
  batch_size: 20
  max_tokens: 8000
  input_cost_per_mtok: 0.10
  output_cost_per_mtok: 0.50
  themes: [music, comedy, theater, arts & museums, food & drink, festivals & fairs, nightlife, sports, film, family, other]
  duplicate_similarity: 0.80  # embedding cosine above which Haiku checks whether two listings are one event

daily:
  # Run once a day by the scheduler (see docs/PRODUCTION.md): retrain, search the default queries, colour the new cards.
  max_results: 2  # per query
  timezone: America/New_York  # whose "today" search windows start from (daily job and the Search tab)

swipe:
  queue_size: 5  # cards fetched at a time; their SHAP colouring is computed ahead
  heartbeat_seconds: 30

event_map:
  min_points: 5
  umap_neighbors: 15
  umap_min_dist: 0.1
  calibration_bins: 6
  umap_metric: cosine
  umap_random_state: 42
  surface_grid: 120
  surface_bandwidth_frac: 0.045
  surface_min_weight: 0.2
  width: 512
  height: 470

explain:
  max_evals: 500
  color_floor: 0.05
  mask_token: "..."

app:
  seconds_per_query: 30
  cost_per_query: 0.065
  page_size: 50

auth:
  max_failures: 5
  window_seconds: 600
  cookie_days: 90  # how long a phone stays signed in

server:
  port: 8080
  idle_shutdown_seconds: 600
  check_seconds: 30
  heartbeat_fresh_seconds: 90
