<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Recommender — sign in</title>
<link rel="manifest" href="/pwa/manifest.json">
<meta name="theme-color" content="#2166ac">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #3a3a3a;
       display: flex; min-height: 90vh; align-items: center; justify-content: center; margin: 0; }
main { width: 100%; max-width: 360px; padding: 2rem; }
input, button { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 0.7rem; border-radius: 6px; }
input { border: 1px solid #8a8a8a; margin: 0.5rem 0 1rem; }
button { border: 0; background: #2166ac; color: #fff; }
.error { color: #b2182b; }
</style>
</head>
<body>
<main>
<h1>Event Recommender</h1>
<form method="post" action="/login">
<input type="hidden" name="next" value="{next}">
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" autofocus>
<button type="submit">Sign in</button>
</form>
<p class="error">{error}</p>
</main>
</body>
</html>
