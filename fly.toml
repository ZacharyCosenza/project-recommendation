app = "event-recommender"
primary_region = "ord"
swap_size_mb = 1024

[build]

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "data_volume"
  destination = "/app/data"
